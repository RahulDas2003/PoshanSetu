services:
  - type: web
    name: smartai-nutrition-api
    runtime: node
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE
        value: 7d
      - key: COOKIE_EXPIRE
        value: "7"
      - key: FRONTEND_URL
        sync: false
      - key: CALORIE_NINJAS_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
